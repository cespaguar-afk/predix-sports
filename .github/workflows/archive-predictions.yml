name: Archivar pronósticos antes de cada partido
on:
  workflow_dispatch:
  schedule:
    - cron: '11 */2 * * *'
  workflow_run:
    workflows:
      - Actualizar datos deportivos de Predix Sports
    types: [completed]

permissions:
  contents: write

concurrency:
  group: predix-predictions
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conservar predicciones anteriores al partido
        run: node scripts/archive_predictions.mjs
      - name: Validar tests
        run: npm test
      - name: Guardar histórico público
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/predictions.json
          if git diff --cached --quiet; then
            echo "Sin cambios de predicciones"
            exit 0
          fi
          git commit -m 'Archivar predicciones anteriores al partido'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "No se pudo publicar por conflicto" >&2
          exit 1
