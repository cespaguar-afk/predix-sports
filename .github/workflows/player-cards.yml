name: Actualizar amonestaciones por jugador
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_player_cards.py'
      - '.github/workflows/player-cards.yml'
  schedule:
    - cron: '42 5,17 * * *'

permissions:
  contents: write

concurrency:
  group: predix-player-cards
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reunir estadísticas de jugadores con aparición confirmada
        run: python3 scripts/sync_player_cards.py
      - name: Comprobar modelos deportivos
        run: node --test tests/*.test.mjs
      - name: Publicar solo los nuevos históricos verificables
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/player_cards.json
          if git diff --cached --quiet; then
            echo 'Sin nuevos datos verificables de tarjetas.'
          else
            git commit -m 'Actualizar amonestaciones históricas de jugadores'
            git push origin HEAD:main
          fi
