name: Probe ESPN Soccer Player Cards
on:
  push:
    paths:
      - '.github/workflows/probe-cards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect recent ESPN match summary card events
        run: |
          python3 - <<'PY'
          import json,urllib.request
          base='https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=18) as response: return json.load(response)
          score=get(base+'scoreboard?dates=202610&limit=100')
          events=[e for e in score.get('events',[]) if e.get('status',{}).get('type',{}).get('state')=='post']
          print('EVENT_COUNT',len(events))
          if not events: raise SystemExit(0)
          for event in events[:3]:
              print('MATCH_ID',event['id'])
              try:
                  data=get(base+'summary?event='+event['id'])
                  print('SUMMARY_KEYS',list(data))
                  for k in ('keyEvents','plays'):
                      items=data.get(k,[])
                      print(k,'COUNT',len(items))
                      for x in items[:2]: print(k,'EXAMPLE',json.dumps(x,ensure_ascii=False)[:1000])
                      card=[x for x in items if 'card' in json.dumps(x).lower()]
                      print(k,'CARDS',len(card))
                      for x in card[:2]:print(k,'CARD_SAMPLE',json.dumps(x,ensure_ascii=False)[:1400])
                  box=data.get('boxscore') or {}
                  print('BOX_KEYS',list(box))
                  print('BOX_PLAYERS_LEN',len(box.get('players',[])))
                  for p in box.get('players',[])[:1]:print('BOX_PLAYER',json.dumps(p,ensure_ascii=False)[:2500])
                  break
              except Exception as e:print('ERROR',str(e))
          PY
