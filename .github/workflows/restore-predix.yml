name: Install Predix Sports source
on:
  push:
    paths:
      - '.github/predix-payload.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and validate Predix Sports
        run: |
          base64 -d .github/predix-payload.txt > /tmp/predix.tar.xz
          echo '659dc6746656e7f216a1473e1647a59c3f9157537f8f6a6da66337da01f67d89  /tmp/predix.tar.xz' | sha256sum -c -
          tar -xJf /tmp/predix.tar.xz
          test -f index.html && test -f src/main.js && test -f sw.js
          node --test tests/model.test.mjs
      - name: Commit project files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html styles.css manifest.webmanifest sw.js package.json assets src tests
          git diff --cached --quiet || (git commit -m 'Add Predix Sports v1.0 source code' && git push)
