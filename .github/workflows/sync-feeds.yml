name: Actualizar datos deportivos de Predix Sports
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-feeds.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: predix-feeds
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Descargar CSV públicos de fútbol
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p feeds
          for league in ESP_1_la-liga ESP_2_segunda-division ENG_1_premier-league UEFA_1_champions-league ESP_CUP_copa-del-rey; do
            for kind in results fixtures; do
              url="https://raw.githubusercontent.com/oladeeayo/open-matchday/master/data/${league}/${kind}_2627.csv"
              file="feeds/${league}_${kind}.csv"
              tmp="$(mktemp)"
              curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 30 "$url" > "$tmp"
              head -n 1 "$tmp" | grep -q '^gw,date,time,home,away'
              test "$(wc -l < "$tmp")" -gt 1
              mv "$tmp" "$file"
              echo "OK: $file"
            done
          done
      - name: Guardar calendarios públicos ESPN (sin claves)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, urllib.request, json, time
          from pathlib import Path
          now=datetime.datetime.now(datetime.timezone.utc)
          def month(offset):
              n=now.year*12+(now.month-1)+offset
              return f'{n//12:04d}{n%12+1:02d}'
          leagues={
              'nba':('basketball/nba',range(-2,3)),
              'nations':('soccer/uefa.nations',range(-3,6)),
              'supercopa':('soccer/esp.super_cup',range(-2,6)),
              'copadelrey':('soccer/esp.copa_del_rey',range(-2,6)),
          }
          def minimal(e):
              c=(e.get('competitions') or [{}])[0]
              comp=[]
              for entry in c.get('competitors',[]):
                  team=entry.get('team') or {}
                  comp.append({'homeAway':entry.get('homeAway'), 'score':entry.get('score'),
                               'team':{k:team.get(k) for k in ('displayName','name','shortDisplayName','abbreviation')}})
              st=((e.get('status') or {}).get('type') or {})
              return {'id':e.get('id'),'date':e.get('date'),
                      'status':{'type':{'state':st.get('state'),'shortDetail':st.get('shortDetail')}},
                      'competitions':[{'competitors':comp}]}
          for key,(league,months) in leagues.items():
              events={}; ok=0
              for offset in months:
                  ym=month(offset)
                  url=f'https://site.api.espn.com/apis/site/v2/sports/{league}/scoreboard?dates={ym}&limit=500'
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (PredixSports personal app)','Accept':'application/json'})
                      with urllib.request.urlopen(req,timeout=15) as response: payload=json.load(response)
                      if not isinstance(payload.get('events'),list): raise ValueError('Respuesta sin eventos')
                      ok+=1
                      for e in payload['events']:
                          if e.get('id') and e.get('date'): events[str(e['id'])]=minimal(e)
                  except Exception as exc:
                      print(f'{key} {ym}: sin respuesta ({exc})')
              if events:
                  output={'fetchedAt':now.isoformat(),'events':list(events.values())}
                  Path(f'feeds/{key}.json').write_text(json.dumps(output,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
                  print(f'OK {key}: {len(events)} encuentros, meses correctos: {ok}')
              else:
                  print(f'Sin nuevos encuentros para {key}; conservar copia previa (meses correctos: {ok})')
          PY
      - name: Comprobar datos, código y modelos
        run: |
          node --test tests/*.test.mjs
      - name: Guardar feeds actualizados en main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/
          if git diff --cached --quiet; then
            echo 'Sin cambios en los datos.'
          else
            git commit -m 'Actualizar datos deportivos públicos'
            git push origin HEAD:main
          fi
