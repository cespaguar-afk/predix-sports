<style>
:root{color-scheme:dark;--bg:#0b1121;--ink:#f7f1eb;--muted:#aaaabe;--accent:#efb4a3;--gold:#f0cd96;--line:rgba(255,255,255,.14);--glass:rgba(255,255,255,.065);--green:#abd9be}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 68% -9%,#443148 0,transparent 48%),radial-gradient(ellipse at -20% 90%,#1a3044 0,transparent 46%),var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.3;background-image:radial-gradient(#fff .65px,transparent .9px),radial-gradient(#f5d7a9 .65px,transparent 1px);background-size:72px 80px,119px 129px;background-position:9px 12px,56px 77px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.shell{width:min(100% - 32px,490px);margin:auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;z-index:1}.masthead{display:flex;align-items:center;justify-content:space-between;padding:26px 2px 17px;gap:12px}.brand{font-size:10px;letter-spacing:.23em;font-weight:800;color:var(--gold);display:flex;align-items:center;gap:10px}.brand-mark{display:grid;place-items:center;width:29px;height:29px;border-radius:10px;border:1px solid rgba(240,205,150,.5);font-family:Georgia,serif;font-size:17px;letter-spacing:0}.mini-badge{border:1px solid var(--line);border-radius:50px;padding:7px 11px;color:#d1cad1;font-size:10px;font-weight:700;letter-spacing:.1em;white-space:nowrap}.progress{display:flex;gap:7px;margin:1px 0 26px}.progress span{height:3px;flex:1;border-radius:99px;background:#414152;transition:background .35s}.progress span.active{background:linear-gradient(90deg,var(--accent),var(--gold))}main{flex:1;animation:appear .45s cubic-bezier(.2,.8,.2,1) both}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:10px;font-weight:800;color:var(--gold);margin:0 0 14px}.headline{font:normal clamp(40px,10vw,60px)/1.05 Georgia,"Times New Roman",serif;letter-spacing:-.04em;margin:0 0 17px}.headline em{font-weight:normal;color:var(--accent);font-style:italic}.deck{color:#d4cbd0;font-size:15px;line-height:1.75;max-width:420px;margin:0 0 23px}.panel{position:relative;border-radius:25px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.115),rgba(255,255,255,.027));padding:22px;box-shadow:0 20px 55px rgba(0,0,0,.14);overflow:hidden}.panel+.panel{margin-top:13px}.panel-label{font-size:10px;letter-spacing:.18em;color:var(--gold);font-weight:800;text-transform:uppercase;margin-bottom:10px}.panel-title{font-family:Georgia,"Times New Roman",serif;font-size:29px;font-weight:400;line-height:1.13;letter-spacing:-.028em;margin:0 0 10px}.panel p{color:#d0c8d0;line-height:1.65;margin:8px 0 0;font-size:14px}.primary{width:100%;border:0;border-radius:15px;padding:17px 19px;background:linear-gradient(115deg,#e9af9e,#f1d2a5);color:#251c2a;font-size:14px;font-weight:800;box-shadow:0 12px 27px rgba(237,173,149,.14);display:flex;justify-content:center;align-items:center;gap:10px;margin-top:17px;transition:transform .2s,filter .2s}.primary:hover{filter:brightness(1.05)}.primary:active{transform:scale(.98)}.primary:disabled{opacity:.37;box-shadow:none;cursor:not-allowed}.secondary{width:100%;border:1px solid rgba(255,255,255,.21);border-radius:14px;padding:14px 17px;background:rgba(255,255,255,.04);color:#e8dde2;font-size:13px;font-weight:700;margin-top:11px}.hint{font-size:12px;color:var(--muted);text-align:center;margin:12px 5px 0}.hero-art{height:240px;margin:18px -4px 28px;position:relative;border:1px solid rgba(255,255,255,.1);border-radius:28px;background:radial-gradient(ellipse at 50% 110%,rgba(251,169,146,.42),transparent 55%),linear-gradient(180deg,#3a3048 0,#1d263e 60%,#111b30);overflow:hidden}.hero-art::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.25),transparent 60%)}.moon{position:absolute;top:38px;right:46px;width:58px;height:58px;border-radius:100%;background:#f8ddb5;box-shadow:0 0 50px rgba(251,208,151,.45)}.city{position:absolute;bottom:0;left:0;right:0;width:100%;height:auto;display:block}.art-caption{position:absolute;bottom:21px;left:20px;z-index:1;font-size:10px;letter-spacing:.28em;font-weight:800;color:rgba(255,255,255,.76)}.roadmap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:20px 0}.stop{border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:14px 8px;text-align:center}.stop .num{display:block;color:var(--gold);font-size:11px;margin-bottom:5px;font-weight:800}.stop .place{display:block;font-size:11px;font-weight:800;letter-spacing:.02em}.stop .desc{display:block;font-size:10px;color:#bbb2c1;margin-top:3px}.chapter-banner{height:126px;border-radius:21px;margin:0 0 24px;position:relative;overflow:hidden;background:linear-gradient(125deg,#503744,#252b46)}.chapter-banner:after{content:"";position:absolute;width:130px;height:130px;border:1px solid rgba(255,255,255,.2);border-radius:100%;right:-15px;top:-30px;box-shadow:0 0 0 25px rgba(255,255,255,.025),0 0 0 50px rgba(255,255,255,.018)}.chapter-banner .big-icon{font-size:64px;position:absolute;right:40px;top:15px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.24));z-index:1}.chapter-banner .banner-caption{position:absolute;left:22px;bottom:20px;font-family:Georgia,serif;font-size:24px;z-index:2}.chapter-banner.ikea{background:linear-gradient(120deg,#223a46,#3b3047)}.chapter-banner.final{background:linear-gradient(120deg,#58394e,#1e3146)}.task{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.14);padding:16px 14px;border-radius:15px;margin:9px 0;color:var(--ink);transition:border .2s,background .2s}.task.done{border-color:rgba(171,217,190,.58);background:rgba(171,217,190,.07)}.task-indicator{flex:0 0 29px;height:29px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.24);border-radius:10px;font-size:13px;font-weight:800;color:var(--gold);margin-top:2px}.task.done .task-indicator{background:var(--green);color:#183126;border-color:var(--green)}.task strong{display:block;font-size:14px;margin:0 0 4px}.task small{display:block;color:#beb9c7;font-size:12px;line-height:1.45}.pill{display:inline-block;padding:7px 12px;border:1px solid rgba(240,205,150,.35);border-radius:50px;background:rgba(240,205,150,.07);color:#eacba7;font-size:11px;font-weight:800;letter-spacing:.045em;margin:0 0 12px}.question{padding:18px;border:1px dashed rgba(240,205,150,.36);background:rgba(240,205,150,.055);border-radius:17px;margin:17px 0 2px}.question h3{margin:0 0 12px;font:normal 21px/1.25 Georgia,serif}.option{display:block;width:100%;margin:8px 0;padding:12px 14px;color:#f2e9e9;text-align:left;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:12px;font-size:13px}.option.selected{border-color:var(--gold);background:rgba(240,205,150,.14)}.error{color:#ffc5b7;font-size:12px;margin:11px 0 0}.success{color:var(--green);font-size:12px;margin:11px 0 0}.seal{width:96px;height:96px;display:grid;place-items:center;margin:25px auto;border:2px solid var(--gold);box-shadow:0 0 0 7px rgba(240,205,150,.05),inset 0 0 25px rgba(240,205,150,.12);border-radius:100%;transform:rotate(-10deg);font:normal 47px Georgia,serif;color:var(--gold);animation:stamp .7s cubic-bezier(.2,1.8,.4,1) both}@keyframes stamp{0%{transform:scale(1.7) rotate(6deg);opacity:0}100%{transform:scale(1) rotate(-10deg);opacity:1}}.reward{text-align:center;padding:8px 0 0}.reward h2{font:normal 39px/1.08 Georgia,serif;margin:12px 0;color:#f5dfc5}.reward p{color:#d1c3ce;line-height:1.65;font-size:14px}.secret-chip{background:rgba(240,205,150,.07);border:1px solid rgba(240,205,150,.25);border-radius:15px;padding:14px;margin:18px 0 5px}.secret-chip small{display:block;text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:var(--muted);margin-bottom:4px}.secret-chip strong{font:normal 26px Georgia,serif;color:var(--gold)}.stamps{display:flex;gap:8px;margin:15px 0 22px}.stamp-mini{flex:1;border-radius:12px;border:1px solid rgba(255,255,255,.14);padding:11px 4px;text-align:center;background:rgba(255,255,255,.045)}.stamp-mini.on{border-color:rgba(240,205,150,.53);background:rgba(240,205,150,.09)}.stamp-mini span{display:block;font-size:9px;color:var(--muted);letter-spacing:.1em}.stamp-mini strong{display:block;font-size:12px;color:#e6dbc9;margin-top:3px}.gate-note{background:rgba(255,255,255,.055);border:1px solid var(--line);padding:20px;border-radius:19px;text-align:center;margin:23px 0}.gate-note strong{display:block;font:normal 23px/1.3 Georgia,serif;color:#f3dec1}.gate-note small{display:block;color:var(--muted);margin-top:10px}.envelope{width:230px;height:155px;margin:30px auto 10px;position:relative;filter:drop-shadow(0 15px 18px rgba(0,0,0,.3));animation:float 3.7s ease-in-out infinite}.env-body{position:absolute;inset:0;background:linear-gradient(145deg,#f9dcc5,#df9c9b);border-radius:10px}.env-body::before{content:"";position:absolute;inset:0;background:linear-gradient(29deg,transparent 49.7%,rgba(215,129,138,.8) 50%,transparent 50.4%),linear-gradient(-29deg,transparent 49.7%,rgba(215,129,138,.8) 50%,transparent 50.4%);border-radius:10px}.env-triangle{position:absolute;top:-1px;left:0;width:0;height:0;border-left:115px solid transparent;border-right:115px solid transparent;border-top:88px solid #f5c6b7;filter:drop-shadow(0 3px 1px rgba(0,0,0,.08))}.seal-dot{position:absolute;left:92px;top:63px;width:46px;height:46px;border-radius:50%;background:#8c4e64;border:2px solid #e2ac9b;display:grid;place-items:center;color:#ffe5ca;font:normal 29px Georgia,serif}@keyframes float{50%{transform:translateY(-7px)}}.reveal-screen{background:linear-gradient(170deg,rgba(56,41,64,.67),rgba(16,27,47,.6));border:1px solid rgba(246,208,167,.27);border-radius:26px;padding:16px 19px 23px;box-shadow:0 15px 65px rgba(0,0,0,.2);position:relative;overflow:hidden}.reveal-screen:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 65% 10%,rgba(243,196,130,.16),transparent 45%);pointer-events:none}.reveal-image{height:170px;margin:0 -3px 22px;border-radius:17px;overflow:hidden;position:relative;background:linear-gradient(#54425f,#c77d7e 60%,#3a4266)}.reveal-image svg{position:absolute;bottom:0;width:100%;height:auto}.reveal-heading{font:normal clamp(40px,9vw,53px)/1.04 Georgia,serif;color:#fff0dc;text-align:center;letter-spacing:-.045em;margin:5px 0 17px}.reveal-heading em{display:block;color:#f1bfae;font-weight:normal}.ticket{margin:20px 0;background:#f5e9d8;color:#30242e;border-radius:15px;padding:19px 17px;position:relative;box-shadow:0 12px 35px rgba(0,0,0,.17)}.ticket:before,.ticket:after{content:"";position:absolute;top:53%;width:18px;height:18px;background:#283046;border-radius:50%}.ticket:before{left:-9px}.ticket:after{right:-9px}.ticket-top{font-size:9px;letter-spacing:.22em;color:#856b6b;font-weight:800;margin-bottom:14px}.ticket-route{display:flex;align-items:center;justify-content:space-between;gap:5px;font-weight:800;font-size:17px}.ticket-route span:nth-child(2){font-size:18px;color:#a98279}.ticket-date{padding-top:13px;margin-top:14px;border-top:1px dashed #d0b9ae;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800}.letter{font:italic 17px/1.65 Georgia,serif;color:#f6e6dc;text-align:center;margin:18px 5px 5px}.confetti{pointer-events:none;position:fixed;inset:0;z-index:5;overflow:hidden}.confetti b{display:block;position:absolute;top:-18px;width:7px;height:14px;border-radius:2px;opacity:.9;animation:fall var(--d) linear forwards;transform:rotate(var(--r))}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(710deg);opacity:0}}footer{text-align:center;color:#938b9e;font-size:10px;letter-spacing:.05em;padding:32px 0 20px}footer button{background:none;border:none;color:#a9a2b0;text-decoration:underline;font-size:10px;padding:8px}.spacer{height:12px}@media(min-width:700px){.shell{padding-bottom:30px}.hero-art{height:260px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="shell">
<header class="masthead"><div class="brand"><span class="brand-mark">✦</span> MISSIÓ SECRETA</div><span class="mini-badge" id="topStatus">EXPEDIENT 001</span></header>
<div class="progress" id="progress" aria-label="Progrés de la missió"><span></span><span></span><span></span></div>
<main id="app" aria-live="polite"></main>
<footer>Fet per a dos, i per a ningú més. ♡ <div><button type="button" id="resetButton">Reiniciar el joc</button></div></footer>
</div>
<script>
(()=>{
'use strict';
const STORE='missio_romantica_2026_v2';
const initial=()=>({step:'intro',splau:[false,false,false],splauAnswer:'',ikea:[false,false,false],ikeaChoice:'',montReached:false,finalAnswer:'',errors:0});
let s=initial();
try{const prev=JSON.parse(localStorage.getItem(STORE)||'null');if(prev&&typeof prev==='object'&&typeof prev.step==='string'&&Array.isArray(prev.splau)&&Array.isArray(prev.ikea))s={...s,...prev};}catch(e){}
const app=document.getElementById('app');const status=document.getElementById('topStatus');const progress=document.getElementById('progress');
const scene={intro:0,splau:1,splauReward:1,ikea:2,ikeaReward:2,mont:3,gate:3,reveal:3};
function save(){try{localStorage.setItem(STORE,JSON.stringify(s))}catch(e){}}
function nav(step){s.step=step;s.errors=0;save();render();window.scrollTo({top:0,behavior:'smooth'});}
const primary=(txt,action,disabled=false)=>`<button class="primary" type="button" data-action="${action}" ${disabled?'disabled':''}>${txt} <span aria-hidden="true">→</span></button>`;
const stamps=(count)=>`<div class="stamps" aria-label="Segells aconseguits"><div class="stamp-mini ${count>=1?'on':''}"><span>SEGELL 01</span><strong>${count>=1?'RECORD':'···'}</strong></div><div class="stamp-mini ${count>=2?'on':''}"><span>SEGELL 02</span><strong>${count>=2?'COMPARTIR':'···'}</strong></div><div class="stamp-mini ${count>=3?'on':''}"><span>SEGELL 03</span><strong>${count>=3?'AMB TU':'···'}</strong></div></div>`;
function art(city='barcelona'){
 if(city==='budapest')return `<div class="reveal-image" role="img" aria-label="Il·lustració nocturna del Parlament de Budapest al costat del Danubi"><svg viewBox="0 0 460 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="348" cy="49" r="26" fill="#ffe1ba" opacity=".9"/><g fill="#392f4a"><rect x="0" y="148" width="460" height="72"/><path d="M25 147V98h16V78h7v20h16v49zM63 149v-28h40v28zM360 148V91h13V72h6v19h15v57zM397 148V106h21v42z"/></g><g fill="#1a233d"><rect x="83" y="136" width="290" height="34"/><path d="M93 140v-54h18v54zM103 88V66h3v22zM128 140V108h20v32zM164 140V91h15v49zM185 140v-27h88v27zM199 113c0-43 9-67 30-76 21 9 30 33 30 76zM226 42V22h6v20zM276 140V91h15v49zM310 140v-32h20v32zM345 140V86h19v54zM354 86V64h3v22z"/><path d="M70 142h320v28H70z"/></g><g fill="#f1cba4" opacity=".85"><rect x="94" y="115" width="4" height="8"/><rect x="109" y="115" width="4" height="8"/><rect x="142" y="120" width="4" height="8"/><rect x="176" y="118" width="4" height="8"/><rect x="291" y="115" width="4" height="8"/><rect x="321" y="120" width="4" height="8"/><rect x="349" y="114" width="4" height="8"/><rect x="210" y="118" width="4" height="8"/><rect x="246" y="118" width="4" height="8"/><rect x="228" y="85" width="4" height="8"/><rect x="228" y="99" width="4" height="8"/></g><path d="M0 170h460v50H0z" fill="#283d5b"/><g stroke="#ebc6a7" opacity=".6" stroke-width="2"><path d="M15 186h115M166 195h80M280 180h155M110 207h230"/></g></svg></div>`;
 return `<div class="hero-art" role="img" aria-label="Il·lustració d'una ciutat sota la lluna"><div class="moon"></div><svg class="city" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 130" aria-hidden="true"><path d="M0 92h31V43h22v16h19V30h13v62h19V64h29v28h19V52h26v40h19V38h22v54h14V57h24v35h19V44h21v48h19V23h15v69h16V51h19v41h26V60h21v32h19V48h19v44h23v38H0z" fill="#253047"/><path d="M0 105h42V84h19v21h35V79h27v26h23V71h22v34h18V89h47v16h30V74h15v31h40V87h27v18h21V71h24v34h35V90h24v40H0z" fill="#111c30"/><g fill="#e4bb9d" opacity=".54"><rect x="45" y="53" width="4" height="7"/><rect x="80" y="43" width="3" height="9"/><rect x="154" y="64" width="4" height="6"/><rect x="231" y="63" width="4" height="8"/><rect x="300" y="46" width="4" height="7"/><rect x="366" y="73" width="4" height="7"/><rect x="403" y="57" width="4" height="6"/><rect x="178" y="97" width="3" height="5"/></g></svg><div class="art-caption">TRES LLOCS · UN SECRET</div></div>`;
}
function task(index,title,desc,done,group){return `<button class="task ${done?'done':''}" type="button" data-action="toggle" data-group="${group}" data-index="${index}" aria-pressed="${done}"><span class="task-indicator">${done?'✓':`0${index+1}`}</span><span><strong>${title}</strong><small>${desc}</small></span></button>`}
function render(){
 const curr=scene[s.step]??0;progress.querySelectorAll('span').forEach((e,i)=>e.classList.toggle('active',curr>i));status.textContent=s.step==='reveal'?'MISSIÓ COMPLERTA':`SEGELL ${Math.min(curr,3)} DE 3`;
 let html='';
 switch(s.step){
 case 'intro':html=`<p class="eyebrow">Una invitació només per a tu</p><h1 class="headline">Avui no és un <em>dia qualsevol.</em></h1><p class="deck">Hi ha un petit secret amagat en un dia de compres. Per descobrir-lo, hauràs de completar tres missions reals. Cap regal per obrir. Cap pista de paper. Només tu, jo i una última porta.</p>${art()}<div class="roadmap"><div class="stop"><span class="num">01</span><span class="place">SPLAU</span><span class="desc">Investiga</span></div><div class="stop"><span class="num">02</span><span class="place">IKEA</span><span class="desc">Descobreix</span></div><div class="stop"><span class="num">03</span><span class="place">MONTJUÏC</span><span class="desc">Desbloqueja</span></div></div><div class="panel"><div class="panel-label">Les regles del joc</div><p>Troba el que et demanem, guanya els tres segells i no intentis avançar abans d'arribar a cada lloc. La darrera sorpresa està completament oculta.</p></div>${primary('Accepto la missió','start')}<p class="hint">No cal comprar res per jugar · Sense límit de temps</p>`;break;
 case 'splau':{
 const n=s.splau.filter(Boolean).length;html=`<div class="chapter-banner"><span class="big-icon" aria-hidden="true">✧</span><div class="banner-caption">Capítol I · L'elecció</div></div><p class="eyebrow">Parada 01 / Splau</p><h1 class="headline">La maleta <em>invisible.</em></h1><p class="deck">Imagina que demà comença una aventura de la qual no saps res. Tens 10 minuts per trobar tres coses entre les botigues. No cal comprar-les.</p><div class="pill">Objectes trobats · ${n}/3</div>${task(0,'Alguna cosa que t’abrigui','Troba una peça que t’emportaries si fes molt fred.',s.splau[0],'splau')}${task(1,'Un look per a una nit especial','Troba una peça que et faria il·lusió portar en una cita.',s.splau[1],'splau')}${task(2,'Una prova de complicitat','Feu-vos una selfie junts al centre comercial.',s.splau[2],'splau')}`;
 if(n===3)html+=`<div class="question"><div class="panel-label">Enigma per aconseguir el segell</div><h3>Què no pesa res a la maleta, però et pots endur per sempre?</h3>${['Una pedra','Un record','Un paraigua'].map((x,i)=>`<button type="button" data-action="splauAnswer" data-value="${i}" class="option ${s.splauAnswer===String(i)?'selected':''}">${x}</button>`).join('')}${s.errors?'<p class="error">Encara no! Pensa en les coses que queden dins nostre.</p>':''}</div>${primary('Segellar el passaport','validateSplau',s.splauAnswer==='')}`;
 else html+=`<p class="hint">Marca cada missió quan l'hagis completat.</p>`;
 break;}
 case 'splauReward':html=`<div class="reward"><p class="eyebrow">Capítol I completat</p><div class="seal">I</div><h2>Primer segell<br>aconseguit</h2><p>Hi ha coses que no necessiten una maleta.</p><div class="secret-chip"><small>Fragment de la clau</small><strong>UN RECORD</strong></div>${stamps(1)}<p>La pròxima prova t'espera entre habitacions, sofàs i idees de futur.</p></div>${primary('Continuar a IKEA','goIkea')}<p class="hint">Podeu seguir comprant amb calma. La missió no té rellotge.</p>`;break;
 case 'ikea':{
 const n=s.ikea.filter(Boolean).length;html=`<div class="chapter-banner ikea"><span class="big-icon" aria-hidden="true">⌂</span><div class="banner-caption">Capítol II · El futur</div></div><p class="eyebrow">Parada 02 / IKEA</p><h1 class="headline">Una casa plena de <em>moments.</em></h1><p class="deck">Les coses més importants d'una casa no es poden posar al carro. Troba aquests tres racons mentre mireu mobles.</p><div class="pill">Racons descoberts · ${n}/3</div>${task(0,'El racó del descans','Localitza un sofà on us imaginaries una tarda de pel·lícula.',s.ikea[0],'ikea')}${task(1,'El lloc de les converses','Troba una taula per a un sopar especial dels dos.',s.ikea[1],'ikea')}${task(2,'La llum perfecta','Escull un llum que faria més càlid el vostre racó favorit.',s.ikea[2],'ikea')}`;
 if(n===3)html+=`<div class="question"><div class="panel-label">L'última decisió</div><h3>Si avui poguessis guardar només una escena d'aquest futur, quina triaries?</h3>${[['film','Una pel·lícula abraçats al sofà'],['dinner','Un sopar improvisat i moltes rialles'],['night','Parlar fins tard sota una llum càlida']].map(([k,v])=>`<button type="button" data-action="ikeaChoice" data-value="${k}" class="option ${s.ikeaChoice===k?'selected':''}">${v}</button>`).join('')}</div>${primary('Guardar aquest moment','validateIkea',!s.ikeaChoice)}`;
 else html+=`<p class="hint">No cal fer fotos ni comprar res. Només trobar-ho i imaginar.</p>`;
 break;}
 case 'ikeaReward':html=`<div class="reward"><p class="eyebrow">Capítol II completat</p><div class="seal">II</div><h2>Segon segell<br>aconseguit</h2><p>Una casa es construeix amb mobles, però els millors moments els construïm nosaltres.</p><div class="secret-chip"><small>Fragment de la clau</small><strong>PER COMPARTIR</strong></div>${stamps(2)}<p>El tercer lloc no és cap botiga. És un gran palau a la muntanya, amb escales, quatre columnes i una ciutat sencera als peus.</p></div>${primary('Anem a descobrir el lloc final','goMont')}<p class="hint">La pista apunta a les escalinates exteriors del MNAC, a Montjuïc.</p>`;break;
 case 'mont':html=`<div class="chapter-banner final"><span class="big-icon" aria-hidden="true">✦</span><div class="banner-caption">Capítol III · L'horitzó</div></div><p class="eyebrow">Parada 03 / Montjuïc</p><h1 class="headline">L'última <em>porta.</em></h1><p class="deck">Ja som al lloc on Barcelona sembla cabre dins d'una mirada. Abans d'obrir el tresor, encara queda una última prova.</p><div class="panel"><div class="panel-label">La prova dels 10 segons</div><p>Poseu-vos junts, mireu la ciutat durant deu segons i després mireu-vos als ulls. El regal final encara no és aquí... però sí la persona amb qui el viuràs.</p></div><div class="question"><div class="panel-label">L'enigma final</div><h3>Quina és l'única cosa que ha estat present en les tres missions?</h3>${[['objectes','Els objectes'],['nosaltres','Nosaltres dos'],['botigues','Les botigues']].map(([k,v])=>`<button type="button" data-action="finalAnswer" data-value="${k}" class="option ${s.finalAnswer===k?'selected':''}">${v}</button>`).join('')}${s.errors?'<p class="error">Torna-ho a pensar. Qui ha estat amb tu tota l’estona?</p>':''}</div>${primary('Aconseguir el tercer segell','validateFinal',!s.finalAnswer)}`;break;
 case 'gate':html=`<div class="reward"><p class="eyebrow">Els tres segells són teus</p><div class="seal">III</div><h2>El secret<br>t'espera.</h2>${stamps(3)}<div class="gate-note"><strong>Un record<br>per compartir<br>amb tu.</strong><small>La pista definitiva no és un lloc d'aquesta ciutat.</small></div><p>Has arribat fins aquí. Ara el teu company de joc et donarà permís per obrir l'últim sobre.</p></div><div class="envelope" role="img" aria-label="Sobre tancat de color rosa"><div class="env-body"></div><div class="env-triangle"></div><div class="seal-dot">♥</div></div>${primary('Obrir el sobre secret','openReveal')}<p class="hint">Només obre'l quan estigueu junts, davant de les vistes.</p>`;break;
 case 'reveal':html=`<div class="reveal-screen"><div class="eyebrow" style="text-align:center">Missió completada · El nostre proper record</div>${art('budapest')}<p style="text-align:center;color:#f1c79e;letter-spacing:.2em;font-size:11px;font-weight:800;margin:7px 0 11px">SORPRESA, AMOR ♡</p><h1 class="reveal-heading">Ens n'anem a <em>Budapest!</em></h1><div class="ticket"><div class="ticket-top">BITLLET PER A UNA AVENTURA DE DOS</div><div class="ticket-route"><span>BARCELONA</span><span>✈</span><span>BUDAPEST</span></div><div class="ticket-date"><span>17 — 21 DES 2026</span><span>2 PERSONES ♡</span></div></div><p class="letter">«Avui hem buscat coses per a casa, però jo volia regalar-te una cosa que no es pot guardar en un calaix: una aventura junts. Els vols i l'allotjament ja estan reservats. El millor del viatge serà viure'l amb tu.»</p></div><p class="hint">Fi del joc. Inici de la nostra pròxima aventura. ♡</p>`;break;
 default:s=initial();return render();
 }
 app.innerHTML=html;
}
function celebrate(){const wrap=document.createElement('div');wrap.className='confetti';wrap.setAttribute('aria-hidden','true');for(let i=0;i<70;i++){const p=document.createElement('b');p.style.left=(Math.random()*100)+'%';p.style.background=['#f4c59b','#f1a4a8','#f6e5c8','#b8d5c0','#dfbada'][i%5];p.style.setProperty('--d',(2+Math.random()*2.2)+'s');p.style.setProperty('--x',((Math.random()-.5)*180)+'px');p.style.setProperty('--r',(Math.random()*120)+'deg');p.style.animationDelay=(Math.random()*.9)+'s';wrap.appendChild(p)}document.body.appendChild(wrap);setTimeout(()=>wrap.remove(),5400)}
app.addEventListener('click',e=>{
 const btn=e.target.closest('button[data-action]');if(!btn||btn.disabled)return;
 const a=btn.dataset.action;
 if(a==='start')return nav('splau');
 if(a==='toggle'){const g=btn.dataset.group,i=Number(btn.dataset.index);if((g==='splau'||g==='ikea')&&i>=0&&i<3){s[g][i]=!s[g][i];save();render()}return}
 if(a==='splauAnswer'){s.splauAnswer=btn.dataset.value;s.errors=0;save();render();return}
 if(a==='validateSplau'){if(s.splau.every(Boolean)&&s.splauAnswer==='1')nav('splauReward');else{s.errors++;save();render()}return}
 if(a==='goIkea')return nav('ikea');
 if(a==='ikeaChoice'){s.ikeaChoice=btn.dataset.value;save();render();return}
 if(a==='validateIkea'&&s.ikea.every(Boolean)&&s.ikeaChoice)return nav('ikeaReward');
 if(a==='goMont')return nav('mont');
 if(a==='finalAnswer'){s.finalAnswer=btn.dataset.value;s.errors=0;save();render();return}
 if(a==='validateFinal'){if(s.finalAnswer==='nosaltres')nav('gate');else{s.errors++;save();render()}return}
 if(a==='openReveal'){nav('reveal');celebrate();return}
});
document.getElementById('resetButton').addEventListener('click',()=>{if(confirm('Vols reiniciar la missió des del principi?')){s=initial();save();render();window.scrollTo({top:0,behavior:'smooth'})}});
render();
})();
</script>
</body>
</html>
